name: Beyblade V-Force
platform: gba
build_system: cmake

versions:
  - name: us
    fullname: US retail
    sha1: cd527c8c24e20e33913fc45199e64b3e6138a6e5
    paths:
      target: baserom/us.gba
      build_dir: build/us
      map: build/us/rom.map
      compiled_target: build/us/rom.gba
      elf: build/us/rom.elf
      expected_dir: expected
      asm: asm/dump
  - name: eu
    fullname: Europe retail
    sha1: 6d20a586e7bb52b4a9352bbeaec9d7be65e93369
    paths:
      target: baserom/eu.gba
      build_dir: build/eu
      map: build/eu/rom.map
      compiled_target: build/eu/rom.gba
      elf: build/eu/rom.elf
      expected_dir: expected
      asm: asm/dump
  - name: debug
    fullname: Europe beta
    sha1: 9210a12ce01fefbf7994af2a8d51351ed82d7253
    paths:
      target: baserom/debug.gba
      build_dir: build/debug
      map: build/debug/rom.map
      compiled_target: build/debug/rom.gba
      elf: build/debug/rom.elf
      expected_dir: expected
      asm: asm/dump

# mapfile_parser: unmatched = .NON_MATCHING on the map, not splat asm-path checks.
tools:
  mapfile_parser:
    progress_report:
      check_asm_paths: False
      report_data: True
      path_index: 1
