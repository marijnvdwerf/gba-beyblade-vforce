name: Beyblade V-Force
platform: gba
build_system: cmake

versions:
  - name: us
    fullname: US
    sha1: cd527c8c24e20e33913fc45199e64b3e6138a6e5
    paths:
      target: build/rom.gba
      build_dir: build
      map: build/rom.map
      compiled_target: build/rom.gba
      elf: build/rom.elf
      expected_dir: expected
      asm: asm/dump

# coddog reads the standard project/version paths above. asmlift uses the
# project-local compiler command and ELF sidecar below.
tools:
  asmlift:
    target: agbcc
    # asmlift reads .symtab names and DWARF declarations/signatures from this unstripped ELF.
    # Keep this relative to decomp.yaml so the CLI resolves it from the project root.
    elf: build/rom.elf
    compiler: >-
      ASMLIFT_DIR="${ASMLIFT_DIR:-/Users/marijn/Projects/asmlift}";
      AGBCC_ROOT="${AGBCC:-$HOME/agbcc/tools/agbcc}";
      tools/agbcc
      --cpp=cc
      --iconv=iconv
      --cc1="$AGBCC_ROOT/bin/old_agbcc"
      --as=arm-none-eabi-as
      --as-include=.
      -Ilib/agb/include
      -I"$AGBCC_ROOT/include"
      -mthumb-interwork
      -Wimplicit
      -Wparentheses
      -Wunused
      -Werror
      -O2
      -fhex-asm
      -g
      -o {{outputPath}}
      -c {{inputPath}}
